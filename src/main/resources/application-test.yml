spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DATABASE_URL_TEST}
    driver-class-name: org.h2.Driver
    username: ${DATABASE_USERNAME_TEST}
    password: ${DATABASE_PASSWORD_TEST}
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialec
server:
  port: 3000

